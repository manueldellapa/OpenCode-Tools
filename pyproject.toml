[project]
name = "opencode-tools"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
opencode-tools = "opencode_tools.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: opt-in, real OpenCode/gh/provider smoke against a disposable target (M15-03, AC-027); never selected by default, run explicitly with `-m live`.",
]

[tool.ruff]
target-version = "py313"

[tool.mypy]
mypy_path = "src"
python_version = "3.13"
strict = true
